<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | SRI PVT LTD</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
<main class="login-card">
  <img src="../assets/logo.svg" class="login-logo" alt="SRI PVT LTD">
  <p class="eyebrow">SECURE ADMINISTRATION</p>
  <h1>Website Admin</h1>
  <p class="muted">Manage website content, images, service areas and SEO.</p>
  <form id="loginForm">
    <label>Email<input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"></label>
    <label>Password<div class="password-box"><input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"><button type="button" id="togglePassword">Show</button></div></label>
    <button class="primary full" type="submit">Sign In</button>
    <div id="loginStatus" class="status"></div>
  </form>
  <div class="setup-note"><b>Administrator access</b><p>The Firebase Authentication user must also exist in Firestore under <code>admins/{UID}</code> with <code>active: true</code>.</p></div>
  <a class="back-link" href="../">← Back to website</a>
</main>
<script src="../config.js"></script>
<script type="module" src="js/login.js"></script>
</body>
</html>
